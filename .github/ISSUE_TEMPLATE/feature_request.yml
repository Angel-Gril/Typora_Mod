name: Feature request
description: 提出功能建议或兼容性需求
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述**要解决的问题**，而不是只给方案。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？影响什么场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
      description: 如果有实现思路，欢迎一并说明
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 原生代理（build/winmm）
        - 图形界面（build/gui）
        - 运行时模块（patches）
        - 工具脚本（tools）
        - 文档（docs）
        - 版本兼容
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 备选方案
      description: 你考虑过的其它做法
    validations:
      required: false
