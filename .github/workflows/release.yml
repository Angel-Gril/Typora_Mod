name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，例如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      full: ${{ steps.ver.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim().TrimStart('v')
          } else {
            $v = "${{ github.ref_name }}".Trim().TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "版本号格式不正确: $v" }
          $parts = $v.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $full = ($parts[0..3] -join '.')
          "version=$v" >> $env:GITHUB_OUTPUT
          "full=$full" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v  full=$full"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Ensure MinGW linker
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64\bin"
          if (Test-Path "$mingw\x86_64-w64-mingw32-gcc.exe") {
            $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "MinGW: $mingw"
          } else {
            choco install mingw --no-progress -y
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/winmm

      - name: Build winmm.dll (GNU target)
        working-directory: build/winmm
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Verify produced DLL
        shell: pwsh
        run: |
          $dll = "build/winmm/target/x86_64-pc-windows-gnu/release/winmm.dll"
          if (-not (Test-Path $dll)) { throw "winmm.dll not built" }
          $size = (Get-Item $dll).Length
          Write-Host "winmm.dll = $([math]::Round($size/1KB,1)) KB"
          # 导出表缺失时产物会明显偏小 (MSVC 误用 GNU 参数就会这样)
          if ($size -lt 200KB) { throw "winmm.dll too small - export table likely missing" }

      - name: Assemble GUI resources
        shell: pwsh
        run: |
          Copy-Item build\winmm\target\x86_64-pc-windows-gnu\release\winmm.dll build\gui\ -Force
          Copy-Item patches\*.js build\gui\ -Force
          Copy-Item patches\VERSION build\gui\ -Force

      - name: Compile TyporaSetup.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $args = @(
            '/nologo','/target:winexe','/codepage:65001','/optimize+',
            '/out:build\gui\TyporaSetup.exe',
            '/win32icon:build\gui\typora-virt.ico',
            '/r:System.Windows.Forms.dll','/r:System.Drawing.dll',
            '/resource:build\gui\winmm.dll,winmm.dll',
            '/resource:build\gui\virt-loader.js,virt-loader.js',
            '/resource:build\gui\registration.js,registration.js',
            '/resource:build\gui\license-virtualize.js,license-virtualize.js',
            '/resource:build\gui\jsc-patch.js,jsc-patch.js',
            '/resource:build\gui\license-forge.js,license-forge.js',
            '/resource:build\gui\state-hunt.js,state-hunt.js',
            '/resource:build\gui\VERSION,VERSION',
            'build\gui\SetupForm.cs'
          )
          & $csc $args
          if ($LASTEXITCODE -ne 0) { throw "csc failed: $LASTEXITCODE" }

      - name: Verify GUI artifact
        shell: pwsh
        run: |
          $exe = "build\gui\TyporaSetup.exe"
          if (-not (Test-Path $exe)) { throw "TyporaSetup.exe not built" }
          Add-Type -AssemblyName System.Reflection
          $asm = [System.Reflection.Assembly]::LoadFile((Resolve-Path $exe))
          $res = @{}
          foreach ($n in $asm.GetManifestResourceNames()) {
            $s = $asm.GetManifestResourceStream($n)
            $res[$n] = $s.Length
            Write-Host ("  {0,-24} {1,8:N1} KB" -f $n, ($s.Length/1KB))
          }
          foreach ($need in @('winmm.dll','virt-loader.js','registration.js','license-virtualize.js','VERSION')) {
            if (-not $res.ContainsKey($need)) { throw "missing embedded resource: $need" }
          }
          if ($res['winmm.dll'] -lt 200KB) { throw "embedded winmm.dll too small ($([math]::Round($res['winmm.dll']/1KB,1)) KB) - export table likely missing" }
          Write-Host "GUI artifact OK"

      - name: Locate Inno Setup
        id: iscc
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "未找到 ISCC，尝试安装 Inno Setup…"
            choco install innosetup --no-progress -y
            $found = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $found)) { throw "Inno Setup 不可用" }
          "iscc=$found" >> $env:GITHUB_OUTPUT
          Write-Host "ISCC: $found"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $full = "${{ steps.ver.outputs.full }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${{ steps.iscc.outputs.iscc }}" /Qp /DMyAppVersion=$ver /DMyAppVersionFull=$full build\gui\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build\gui\TyporaSetup.exe "out\TyporaSetup-$ver.exe" -Force
          Copy-Item "dist\TyporaVirt-Setup-$ver.exe" "out\TyporaVirt-Setup-$ver.exe" -Force
          # 非 ASCII 文件名在 Linux runner 上传时会被降级为 default.md, 这里改用 ASCII 名
          Copy-Item "dist\使用说明.md" "out\USAGE-zh.md" -Force
          Get-ChildItem out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: Show files
        run: ls -la out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.build.outputs.version) || github.ref_name }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: out/*
          body: |
            ## Typora_Mod v${{ needs.build.outputs.version }}

            运行时版本戳：见 `%LOCALAPPDATA%\TyporaVirt\VERSION`

            ### 下载

            | 文件 | 说明 |
            |---|---|
            | `TyporaSetup-${{ needs.build.outputs.version }}.exe` | 绿色单文件，双击即用 |
            | `TyporaVirt-Setup-${{ needs.build.outputs.version }}.exe` | 中文安装向导（开始菜单 + 卸载项） |
            | `USAGE-zh.md` | 使用说明（中文） |

            ### 支持范围

            Typora **1.10.8 ～ 1.14.10**（更早版本为原生主进程，无注入点）。

            > 仅用于安全研究与已授权测试环境。
